[package]
name = "xenomit-bot-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.6.6", default-features = false, features = ["component"] }
gpui-base = "0.6.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt", "time"] }
xenomit_backpage = { git = "https://github.com/xenomit-do/xenomit-backpage", tag = "v0.1.0" }
xenomit-behavior-engine = { git = "https://github.com/xenomit-do/xenomit-behavior-engine", tag = "v0.1.0" }
xenomit-bot-runtime = { git = "https://github.com/xenomit-do/xenomit-bot-runtime", tag = "v0.1.0" }
xenomit-game-api = { git = "https://github.com/xenomit-do/xenomit-game-api", tag = "v0.1.0" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_Security_Cryptography",
] }
